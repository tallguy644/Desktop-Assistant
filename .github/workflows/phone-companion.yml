name: Phone companion

on:
  push:
    paths:
      - "app/**"
      - "companion/**"
      - ".github/workflows/phone-companion.yml"
  pull_request:
    paths:
      - "app/**"
      - "companion/**"
  workflow_dispatch:

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SyraCompanion.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SyraCompanion-v1.1-demo
          path: companion/android/SyraCompanion.apk

  windows:
    name: Build Syra and run companion tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Syra
        shell: cmd
        run: app\Build.cmd < NUL
      - name: Companion tests
        shell: powershell
        run: |
          & .\app\Test-Calendar.ps1 -Suite Companion
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Screen tests (regression)
        shell: powershell
        run: |
          & .\app\Test-Calendar.ps1 -Suite Screens
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: Syra-with-companion
          path: |
            app/Skynet.exe
            app/TaskbarRecovery.exe
