name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_preview:
        description: Also push the HUD preview images to the ci/hud-previews branch
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and package
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 20
    defaults:
      run:
        # Windows PowerShell 5.1, the same shell the build and test scripts target.
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Build app, installer and portable ZIP
        run: .\scripts\Build-Release.ps1

      - name: Self-test
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'syra-selftest'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $p = Start-Process -FilePath (Resolve-Path 'app\Skynet.exe') -ArgumentList '--self-test', "`"$dir`"" -Wait -PassThru
          $report = Join-Path $dir 'Skynet-selftest.txt'
          if (Test-Path -LiteralPath $report) { Get-Content -LiteralPath $report } else { Write-Host 'No self-test report was written.' }
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)." }

      - name: Chat tests
        run: .\app\Test-Chat.ps1

      - name: Feature test suites
        run: |
          foreach ($suite in 'Calendar','TemperatureAlerts','Commute','Browser','NextUp','Screens','Identity','ChatNaming') {
            Write-Host "::group::$suite"
            .\app\Test-Calendar.ps1 -Suite $suite
            Write-Host '::endgroup::'
          }

      - name: Render HUD preview
        run: |
          $out = Join-Path $PWD 'dist\preview'
          $p = Start-Process -FilePath (Resolve-Path 'app\Skynet.exe') -ArgumentList '--render-preview', "`"$out`"" -PassThru
          if (!$p.WaitForExit(120000)) { $p.Kill(); throw 'HUD preview timed out.' }
          if (Test-Path "$out\render-error.txt") { Get-Content "$out\render-error.txt" }
          if ($p.ExitCode -ne 0) { throw "HUD preview failed with exit code $($p.ExitCode)." }
          Get-ChildItem $out

      - name: Upload HUD preview
        uses: actions/upload-artifact@v4
        with:
          name: syra-hud-preview-${{ github.sha }}
          path: dist/preview/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Publish HUD preview to branch
        if: github.event_name == 'workflow_dispatch' && inputs.publish_preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $src = Join-Path $PWD 'dist\preview'
          $work = Join-Path $env:RUNNER_TEMP 'hud-previews'
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          Copy-Item "$src\*.png" $work
          Set-Content (Join-Path $work 'SOURCE.txt') "${{ github.ref_name }} ${{ github.sha }}"
          Push-Location $work
          git init -q -b ci/hud-previews
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -q -m "HUD preview for ${{ github.sha }}"
          git push -q -f "https://x-access-token:$env:GH_TOKEN@github.com/${{ github.repository }}.git" ci/hud-previews
          Pop-Location

      - name: Build unsigned MSIX preview
        run: |
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" -ErrorAction SilentlyContinue |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
          if (!$makeappx) { throw 'makeappx.exe was not found in the Windows SDK on this runner.' }
          .\store\Build-Msix.ps1 -DevelopmentPreview -MakeAppxPath $makeappx.FullName

      - name: Checksums
        run: |
          Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe','.zip','.msix' } |
            Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: syra-windows-${{ github.sha }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.msix
            dist/PACKAGE-STATUS.txt
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
